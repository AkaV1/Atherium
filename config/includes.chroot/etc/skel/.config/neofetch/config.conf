# Neofetch para Atherium: muestra el logo en ASCII
print_info() {
    info title
    info underline

    info "OS" distro
    info "Host" model
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "DE" de
    info "WM" wm
    info "Terminal" term
    info "CPU" cpu
    info "GPU" gpu
    info "Memory" memory

    info cols
}

title_fqdn="off"
kernel_shorthand="on"
distro_shorthand="off"
os_arch="on"
uptime_shorthand="on"
memory_percent="on"
package_managers="on"
shell_path="off"
shell_version="on"

colors=(4 6 5 4 6 7)
bold="on"
underline_enabled="on"
underline_char="-"
separator=":"

# --- Logo ASCII de Atherium ---
image_backend="ascii"
image_source="/etc/atherium/logo.ascii"
ascii_distro="auto"
ascii_colors=(1 2 3 4 5 6)
ascii_bold="on"

gap=3
