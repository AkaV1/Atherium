# Picom "ligero" para maquinas virtuales o GPUs sin GLX: sin blur, mismas transparencias
backend = "xrender";
vsync = false;

shadow = true;
shadow-radius = 18;
shadow-opacity = 0.30;
shadow-offset-x = -12;
shadow-offset-y = -8;
shadow-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c"
];

inactive-opacity = 0.80;
active-opacity = 0.88;
frame-opacity = 0.80;
inactive-opacity-override = false;

opacity-rule = [
    "100:class_g = 'firefox-esr' && focused",
    "92:class_g = 'firefox-esr' && !focused",
    "100:class_g = 'Plank'",
    "100:class_g = 'Xfce4-panel'",
    "100:window_type = 'dock'",
    "100:window_type = 'menu'",
    "100:window_type = 'dropdown_menu'",
    "100:window_type = 'popup_menu'"
];

corner-radius = 18;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;

wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.9; focus = true; };
    dock = { shadow = false; };
    dnd = { shadow = false; };
};
