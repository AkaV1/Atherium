# Atherium: ventanas translucidas con blur, estilo macOS. Dock y panel quedan intactos.
backend = "glx";
vsync = true;
use-damage = true;

shadow = true;
shadow-radius = 24;
shadow-opacity = 0.40;
shadow-offset-x = -18;
shadow-offset-y = -14;
shadow-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c"
];

active-opacity = 0.92;
inactive-opacity = 0.84;
frame-opacity = 0.92;
inactive-opacity-override = false;

opacity-rule = [
    "100:class_g = 'firefox-esr' && focused",
    "92:class_g = 'firefox-esr' && !focused",
    "100:class_g = 'libreoffice-writer' || class_g = 'libreoffice-calc' || class_g = 'libreoffice-impress'",
    "100:class_g = 'Plank'",
    "100:window_type = 'dock'",
    "100:window_type = 'menu'",
    "100:window_type = 'dropdown_menu'",
    "100:window_type = 'popup_menu'",
    "100:window_type = 'tooltip'"
];

blur-method = "dual_kawase";
blur-strength = 6;
blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c"
];

corner-radius = 12;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;

wintypes:
{
    dock = { shadow = false; };
    dnd = { shadow = false; };
    tooltip = { fade = true; shadow = true; };
};
