# Picom: transparencias, blur y sombras suaves para Atherium
backend = "glx";
vsync = true;
use-damage = true;

# Sombras
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.35;
shadow-offset-x = -12;
shadow-offset-y = -8;
shadow-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c"
];

# Transparencia
inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 0.85;
inactive-opacity-override = false;

opacity-rule = [
    "88:class_g = 'Xfce4-terminal'",
    "85:class_g = 'Thunar'",
    "80:class_g = 'Xfce4-panel'",
    "100:class_g = 'firefox-esr'"
];

# Desenfoque (efecto cristal)
blur-method = "dual_kawase";
blur-strength = 6;
blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c"
];

# Esquinas redondeadas
corner-radius = 12;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# Animaciones de aparicion
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;

wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.9; focus = true; };
    dock = { shadow = false; clip-shadow-above = true; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 0.92; };
    dropdown_menu = { opacity = 0.92; };
};
